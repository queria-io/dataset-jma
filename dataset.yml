# この dataset.yml は fdl commit が読む（FDL の dataset.json を YAML で書いたもの）。
# 表の説明は models/ の *.table.yml に書く。表と列の型・NULL・行数は fdl commit がカタログから埋める。
# Queria だけの項目（テーマ・カバー・AI 向けの説明・列の意味）は annotations.queria に書く。
name: jma
title: 気象庁 気象データ
description: |-
  気象庁の観測所と予報区のマスタ、短期・週間の天気予報、気象官署の日別・時別の観測値、アメダスの日別平年値、地震の震源、台風の経路（1951 年〜）、さくらの開花日・満開日（1953 年〜）です。

  出典：気象庁（気象庁ホームページ利用規約に準拠）。
keywords:
  - 気象
  - 気温
  - 降水量
  - 観測所
  - アメダス
  - 天気予報
  - 降水確率
  - 週間天気予報
  - 地震
  - 震源
  - マグニチュード
  - 平年値
  - 台風
  - 経路
  - さくら
  - 開花日
  - 生物季節観測
homepage: https://github.com/queria-io/dataset-jma
language: ja

licenses:
  - JP-PDL-1.0

sources:
  - title: 気象庁
    path: https://www.jma.go.jp/
  - title: 過去の気象データ検索
    path: https://www.data.jma.go.jp/stats/etrn/index.php
  - title: 地震月報（カタログ編）
    path: https://www.data.jma.go.jp/eqev/data/bulletin/hypo.html
  - title: RSMC 東京・台風センター ベストトラック
    path: https://www.jma.go.jp/jma/jma-eng/jma-center/rsmc-hp-pub-eg/Besttracks/index.html
  - title: 生物季節観測の情報
    path: https://www.data.jma.go.jp/sakura/data/index.html

contributors:
  - title: 気象庁
    path: https://www.jma.go.jp/
    roles: [rightsHolder]

temporal_coverage: { start: "1951", end: null }
spatial_coverage: [JP]
update_frequency: monthly

schemas:
  - name: main
    title: メイン
annotations:
  queria:
    themes: [land_climate]
    cover: ⛅
    ai_context:
      instructions: |
        気温・降水量の実況と平年の比較、地震の発生分布、天気予報の取得に使う。
        表ごとに収録期間がまったく違うので、期間の前提を必ず確認する。
        mart_jma_normals_daily は1991〜2020年の30年平均（平年値）で、時系列ではない。
        観測所×月日で1行。
        mart_jma_daily_observations は気象官署の日別実況で、直近数か月分だけを持つ（2万7千行・156地点）。
        mart_jma_hourly_observations は主要47地点の直近数日分。長期の時系列分析には使えない。
        mart_jma_hypocenters は地震月報の震源で2019〜2023年。カタログは確定まで数年かかるため、
        直近の地震は入っていない。
        mart_jma_forecast_weather・mart_jma_forecast_pops・mart_jma_forecast_temps は
        ビルド時点の最新発表の1スナップショットで、履歴を持たない。
        降水確率は class10 区域×6時間ごと、予想気温はアメダス地点（station_id）ごとで、粒度が違う。
        mart_jma_typhoon_tracks は1951年以降の全台風の経路で、長期の時系列。
        台風1個 × 6時間ごとの解析で1行。国際番号（international_id）で台風を識別する。
        最大風速と暴風域・強風域の半径は1977年以降しか収録がなく、上陸フラグ（is_landfall）が
        付くのは1991年以降。それより前の台風は上陸していても false になるので、上陸数の
        長期比較には使えない。階級（grade）は台風以外に熱帯低気圧・温帯低気圧の期間も含むので、
        台風としての統計を取るときは grade_code in ('3','4','5') で絞る。
        mart_jma_sakura_phenology は1953年以降のさくらの開花日・満開日で、地点 × 年 × 現象（開花 / 満開）で1行。
        観測値のない年は行が無い。観測地点は1990年の100地点から2020年代は57〜58地点に減っているので、
        全国平均を年ごとに取ると地点構成の変化が混ざる。地点ごとの時系列で比べる。
        種目は地点で違い（そめいよしの / えぞやまざくら / ひかんざくら など）、ひかんざくらは
        1月前後に咲き、前年12月の観測日（day_of_year が0以下）もある。種目をまたいで日付を比べない。
        観測所の番号体系が2つある。アメダスは station_id（5桁）、気象官署は block_no（ブロック番号）で、
        直接は結合できない（地点名で対応づける）。
        欠測・現象なし（降雪や積雪など）はどちらも NULL なので、0 と同じには扱えない。
        時別観測値の hour は1〜24 で、24 は翌日0時を指す。
      synonyms: [気象庁, アメダス, 平年値, 震源, 天気予報, 気温, 降水量, 台風, ベストトラック, 桜, 開花, 生物季節]
      examples:
        - ある地点の気温が平年と比べてどうだったか見たい
        - 震源の分布をマグニチュード別に地図に出したい
        - 主要地点の時間帯別の気温と降水量を出したい
        - 台風の経路を地図に描いて中心気圧の変化を見たい
        - 東京のさくらの開花日がこの70年でどれだけ早まったか見たい
