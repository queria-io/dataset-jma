version: 2

models:
  - name: mart_jma_areas
    description: 気象庁の予報区を表す地域コードの階層マスタ。地方・府県予報区・市町村等をまたぐ区分を、コード・階層レベル・名称（日本語・英語・カナ）・所管気象台・親コードで収録する。
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: area_code
        data_type: VARCHAR
      - name: level
        data_type: VARCHAR
      - name: name
        data_type: VARCHAR
      - name: name_en
        data_type: VARCHAR
      - name: name_kana
        data_type: VARCHAR
      - name: office_name
        data_type: VARCHAR
      - name: parent_code
        data_type: VARCHAR
