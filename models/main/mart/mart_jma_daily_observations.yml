version: 2

models:
  - name: mart_jma_daily_observations
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: block_no
        data_type: VARCHAR
      - name: observed_date
        data_type: DATE
      - name: temp_avg_c
        data_type: DOUBLE
      - name: temp_max_c
        data_type: DOUBLE
      - name: temp_min_c
        data_type: DOUBLE
      - name: precipitation_mm
        data_type: DOUBLE
      - name: sunshine_hours
        data_type: DOUBLE
      - name: snowfall_cm
        data_type: INTEGER
      - name: snow_depth_cm
        data_type: INTEGER
