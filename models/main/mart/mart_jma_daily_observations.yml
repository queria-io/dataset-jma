version: 2

models:
  - name: mart_jma_daily_observations
    description: >-
      気象官署の日別観測値（実況値）。観測所×日ごとに日平均・日最高・日最低気温、
      日降水量、日照時間、降雪・最深積雪を収録する。block_noで
      mart_jma_observation_stationsと結合できる。日別平年値（mart_jma_normals_daily、
      観測所名で対応づけ）と対にすると「実況 vs 平年」の比較ができる。全国の気象官署を
      対象に直近数か月分を収録する（過去月の確定値は変わらない）。観測していない要素や
      現象のない日（降雪・積雪など）、欠測はNULL。
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: block_no
        data_type: VARCHAR
      - name: observed_date
        data_type: DATE
      - name: temp_avg_c
        data_type: DOUBLE
      - name: temp_max_c
        data_type: DOUBLE
      - name: temp_min_c
        data_type: DOUBLE
      - name: precipitation_mm
        data_type: DOUBLE
      - name: sunshine_hours
        data_type: DOUBLE
      - name: snowfall_cm
        data_type: INTEGER
      - name: snow_depth_cm
        data_type: INTEGER
