schema: main
name: mart_jma_forecast_pops
title: 気象庁 降水確率（短期予報）
description: |-
  府県予報区ごとの短期予報の降水確率です。一次細分区域ごと・6 時間ごとの値を持ちます。

  - ビルド時点の最新の発表だけを持ち、ビルドごとに置き換わります
keywords:
  - 気象
  - 天気予報
  - 降水確率
  - 予報区
  - 気象庁
sources:
  - path: https://www.jma.go.jp/bosai/forecast/
fields:
  - name: office_code
    title: 府県予報区コード
    description: 発表元の府県予報区のコード。mart_jma_areas の level=office と結合できる
  - name: report_datetime
    title: 発表日時
    description: この予報の発表時刻（JST）
  - name: area_code
    title: 区域コード
    description: 一次細分区域（class10）。mart_jma_areasのlevel=class10と結合できる
  - name: area_name
    title: 区域名
  - name: forecast_datetime
    title: 予報対象日時
    description: 6時間の区切りの開始時刻（JST）。00時・06時・12時・18時のいずれか
  - name: pop_pct
    title: 降水確率
    description: その6時間に1mm以上の降水がある確率（%）。値の無い区切りはNULL
