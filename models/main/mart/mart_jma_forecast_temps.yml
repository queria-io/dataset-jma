version: 2

models:
  - name: mart_jma_forecast_temps
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: office_code
        data_type: VARCHAR
      - name: report_datetime
        data_type: TIMESTAMP WITH TIME ZONE
      - name: station_id
        data_type: VARCHAR
      - name: station_name
        data_type: VARCHAR
      - name: forecast_datetime
        data_type: TIMESTAMP WITH TIME ZONE
      - name: temp_c
        data_type: INTEGER
