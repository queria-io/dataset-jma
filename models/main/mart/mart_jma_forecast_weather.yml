version: 2

models:
  - name: mart_jma_forecast_weather
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: office_code
        data_type: VARCHAR
      - name: report_datetime
        data_type: TIMESTAMP WITH TIME ZONE
      - name: area_code
        data_type: VARCHAR
      - name: area_name
        data_type: VARCHAR
      - name: forecast_datetime
        data_type: TIMESTAMP WITH TIME ZONE
      - name: weather_code
        data_type: VARCHAR
      - name: weather
        data_type: VARCHAR
      - name: wind
        data_type: VARCHAR
      - name: wave
        data_type: VARCHAR
