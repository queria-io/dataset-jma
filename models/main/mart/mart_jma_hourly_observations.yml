version: 2

models:
  - name: mart_jma_hourly_observations
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: block_no
        data_type: VARCHAR
      - name: observed_date
        data_type: DATE
      - name: hour
        data_type: INTEGER
      - name: temp_c
        data_type: DOUBLE
      - name: precipitation_mm
        data_type: DOUBLE
      - name: humidity_pct
        data_type: INTEGER
      - name: wind_speed_ms
        data_type: DOUBLE
      - name: wind_direction
        data_type: VARCHAR
      - name: sunshine_hours
        data_type: DOUBLE
      - name: pressure_local_hpa
        data_type: DOUBLE
      - name: pressure_sea_hpa
        data_type: DOUBLE
      - name: snow_depth_cm
        data_type: INTEGER
