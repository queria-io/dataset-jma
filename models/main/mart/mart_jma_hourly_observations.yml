version: 2

models:
  - name: mart_jma_hourly_observations
    description: >-
      気象官署の時別観測値（実況値）。観測所×日×時（毎正時）ごとに気温、降水量、湿度、
      風速・風向、日照時間、現地・海面気圧、最深積雪を収録する。時は日本標準時で1〜24
      （24は24時＝翌日0時）。block_noでmart_jma_observation_stationsと結合できる。日別観測値
      （mart_jma_daily_observations）を時間帯まで細かくしたもので、需要予測・電力・小売などの
      時間帯分析に使える。取得負荷を抑えるため各都道府県の地方・管区気象台がある主要地点に絞り、
      直近数日分を収録する（過去日の確定値は変わらない）。観測していない要素や現象のない時
      （積雪など）、欠測はNULL。
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: block_no
        data_type: VARCHAR
      - name: observed_date
        data_type: DATE
      - name: hour
        data_type: INTEGER
      - name: temp_c
        data_type: DOUBLE
      - name: precipitation_mm
        data_type: DOUBLE
      - name: humidity_pct
        data_type: INTEGER
      - name: wind_speed_ms
        data_type: DOUBLE
      - name: wind_direction
        data_type: VARCHAR
      - name: sunshine_hours
        data_type: DOUBLE
      - name: pressure_local_hpa
        data_type: DOUBLE
      - name: pressure_sea_hpa
        data_type: DOUBLE
      - name: snow_depth_cm
        data_type: INTEGER
