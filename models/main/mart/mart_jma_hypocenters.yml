version: 2

models:
  - name: mart_jma_hypocenters
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: origin_time
        data_type: TIMESTAMP
      - name: latitude
        data_type: DOUBLE
      - name: longitude
        data_type: DOUBLE
      - name: depth_km
        data_type: DOUBLE
      - name: magnitude
        data_type: DOUBLE
      - name: magnitude_type
        data_type: VARCHAR
      - name: magnitude2
        data_type: DOUBLE
      - name: magnitude2_type
        data_type: VARCHAR
      - name: region
        data_type: VARCHAR
      - name: record_source
        data_type: VARCHAR
      - name: record_type
        data_type: VARCHAR
      - name: subtype_code
        data_type: VARCHAR
      - name: subtype
        data_type: VARCHAR
      - name: max_intensity_code
        data_type: VARCHAR
      - name: max_intensity
        data_type: VARCHAR
      - name: station_count
        data_type: INTEGER
      - name: hypocenter_flag
        data_type: VARCHAR
