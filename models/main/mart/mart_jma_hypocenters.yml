version: 2

models:
  - name: mart_jma_hypocenters
    description: 気象庁 地震月報（カタログ編）に基づく地震の震源データ。各地震の発生日時、震央の緯度経度、深さ、マグニチュード（種別付き）、震央地名、最大震度、観測点数などを収録する。
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: origin_time
        data_type: TIMESTAMP
      - name: latitude
        data_type: DOUBLE
      - name: longitude
        data_type: DOUBLE
      - name: depth_km
        data_type: DOUBLE
      - name: magnitude
        data_type: DOUBLE
      - name: magnitude_type
        data_type: VARCHAR
      - name: magnitude2
        data_type: DOUBLE
      - name: magnitude2_type
        data_type: VARCHAR
      - name: region
        data_type: VARCHAR
      - name: record_source
        data_type: VARCHAR
      - name: record_type
        data_type: VARCHAR
      - name: subtype_code
        data_type: VARCHAR
      - name: subtype
        data_type: VARCHAR
      - name: max_intensity_code
        data_type: VARCHAR
      - name: max_intensity
        data_type: VARCHAR
      - name: station_count
        data_type: INTEGER
      - name: hypocenter_flag
        data_type: VARCHAR
