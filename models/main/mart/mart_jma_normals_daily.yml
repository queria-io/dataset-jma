version: 2

models:
  - name: mart_jma_normals_daily
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: station_id
        data_type: VARCHAR
      - name: month
        data_type: INTEGER
      - name: day
        data_type: INTEGER
      - name: temp_avg_c
        data_type: DOUBLE
      - name: temp_max_c
        data_type: DOUBLE
      - name: temp_min_c
        data_type: DOUBLE
      - name: sunshine_hours
        data_type: DOUBLE
      - name: precipitation_mm
        data_type: DOUBLE
      - name: snow_depth_cm
        data_type: INTEGER
