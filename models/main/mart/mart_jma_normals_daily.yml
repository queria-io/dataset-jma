version: 2

models:
  - name: mart_jma_normals_daily
    description: >-
      アメダス観測所の日別平年値（統計期間1991〜2020年）。観測所×月日ごとに
      日平均・日最高・日最低気温、日照時間、降水量、積雪の深さの30年平均を収録。
      station_idでmart_jma_stationsと結合できる。観測していない要素や統計値なしの
      日はNULL。2月は閏日（29日）まで収録する。
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: station_id
        data_type: VARCHAR
      - name: month
        data_type: INTEGER
      - name: day
        data_type: INTEGER
      - name: temp_avg_c
        data_type: DOUBLE
      - name: temp_max_c
        data_type: DOUBLE
      - name: temp_min_c
        data_type: DOUBLE
      - name: sunshine_hours
        data_type: DOUBLE
      - name: precipitation_mm
        data_type: DOUBLE
      - name: snow_depth_cm
        data_type: INTEGER
