schema: main
name: mart_jma_observation_stations
title: 気象庁 観測所（気象官署）
description: |-
  日別・時別の観測値を観測している気象官署の一覧です。ブロック番号・地点名・緯度経度を持ちます。

  - アメダス観測所（mart_jma_stations）とは番号の体系が違います。両者は地点名で対応づけてください
keywords:
  - 気象
  - 観測所
  - 気象官署
  - 気象台
  - 気象庁
sources:
  - path: https://www.data.jma.go.jp/stats/etrn/index.php
fields:
  - name: block_no
    title: 観測所番号
    description: 気象官署のブロック番号（5桁）。mart_jma_daily_observationsと結合できる
  - name: prec_no
    title: 地方区分コード
    description: 都府県・地方の区分コード（北海道などは複数に分かれる）
  - name: station_name
    title: 観測所名
    description: 漢字表記
  - name: station_kana
    title: 観測所名（カナ）
    description: カナ表記
  - name: lat
    title: 緯度
    description: 十進度（世界測地系）
  - name: lon
    title: 経度
    description: 十進度（世界測地系）
