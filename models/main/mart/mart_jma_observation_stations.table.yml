schema: main
name: mart_jma_observation_stations
title: 気象庁 観測所（気象官署）
description: 日別観測値（mart_jma_daily_observations）を観測している気象官署の一覧。 block_noで日別観測値と結合できる。地点名・カナ・緯度経度を持ち、位置での
  空間分析にも使える。気象官署はアメダス観測所一覧（mart_jma_stations）とは 別の観測所番号体系（ブロック番号）のため、地点名で対応づける。
keywords:
  - 気象
  - 観測所
  - 気象官署
  - 気象台
  - 気象庁
published: true
sources:
  - path: https://www.data.jma.go.jp/stats/etrn/index.php
fields:
  - name: block_no
    title: 観測所番号
    description: 気象官署のブロック番号（5桁）。mart_jma_daily_observationsと結合できる
  - name: prec_no
    title: 地方区分コード
    description: 都府県・地方の区分コード（北海道などは複数に分かれる）
  - name: station_name
    title: 観測所名
    description: 漢字表記
  - name: station_kana
    title: 観測所名（カナ）
    description: カナ表記
  - name: lat
    title: 緯度
    description: 十進度（世界測地系）
  - name: lon
    title: 経度
    description: 十進度（世界測地系）
