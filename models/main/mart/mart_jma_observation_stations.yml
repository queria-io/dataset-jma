version: 2

models:
  - name: mart_jma_observation_stations
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: block_no
        data_type: VARCHAR
      - name: prec_no
        data_type: VARCHAR
      - name: station_name
        data_type: VARCHAR
      - name: station_kana
        data_type: VARCHAR
      - name: lat
        data_type: DOUBLE
      - name: lon
        data_type: DOUBLE
