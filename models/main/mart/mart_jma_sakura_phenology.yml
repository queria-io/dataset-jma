version: 2

models:
  - name: mart_jma_sakura_phenology
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: station_name
        data_type: VARCHAR
      - name: block_no
        data_type: VARCHAR
      - name: species
        data_type: VARCHAR
      - name: phenomenon
        data_type: VARCHAR
      - name: year
        data_type: INTEGER
      - name: observed_date
        data_type: DATE
      - name: day_of_year
        data_type: INTEGER
      - name: normal_month
        data_type: INTEGER
      - name: normal_day
        data_type: INTEGER
      - name: days_from_normal
        data_type: INTEGER
      - name: is_current_station
        data_type: BOOLEAN
