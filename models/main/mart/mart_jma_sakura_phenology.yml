version: 2

models:
  - name: mart_jma_sakura_phenology
    description: 気象庁の生物季節観測によるさくらの開花日と満開日。1953年以降、全国の気象官署で観測した地点×年の観測日と、平年値（1991〜2020年の平均）からの差を収録する。
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: station_name
        data_type: VARCHAR
      - name: block_no
        data_type: VARCHAR
      - name: species
        data_type: VARCHAR
      - name: phenomenon
        data_type: VARCHAR
      - name: year
        data_type: INTEGER
      - name: observed_date
        data_type: DATE
      - name: day_of_year
        data_type: INTEGER
      - name: normal_month
        data_type: INTEGER
      - name: normal_day
        data_type: INTEGER
      - name: days_from_normal
        data_type: INTEGER
      - name: is_current_station
        data_type: BOOLEAN
