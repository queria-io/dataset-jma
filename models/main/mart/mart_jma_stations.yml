version: 2

models:
  - name: mart_jma_stations
    description: 気象庁のアメダス観測所一覧マスタ。各観測所のID、名称（日本語・カナ・英語）、緯度経度、標高、観測所種別、気象官署かどうか、観測要素を収録する。
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: station_id
        data_type: VARCHAR
      - name: name
        data_type: VARCHAR
      - name: name_kana
        data_type: VARCHAR
      - name: name_en
        data_type: VARCHAR
      - name: lat
        data_type: DOUBLE
      - name: lon
        data_type: DOUBLE
      - name: elevation
        data_type: INTEGER
      - name: station_type
        data_type: VARCHAR
      - name: is_office
        data_type: BOOLEAN
      - name: elems
        data_type: VARCHAR
