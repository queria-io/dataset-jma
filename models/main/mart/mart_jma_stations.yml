version: 2

models:
  - name: mart_jma_stations
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: station_id
        data_type: VARCHAR
      - name: name
        data_type: VARCHAR
      - name: name_kana
        data_type: VARCHAR
      - name: name_en
        data_type: VARCHAR
      - name: lat
        data_type: DOUBLE
      - name: lon
        data_type: DOUBLE
      - name: elevation
        data_type: INTEGER
      - name: station_type
        data_type: VARCHAR
      - name: is_office
        data_type: BOOLEAN
      - name: elems
        data_type: VARCHAR
