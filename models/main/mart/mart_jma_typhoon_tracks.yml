version: 2

models:
  - name: mart_jma_typhoon_tracks
    description: 気象庁が事後解析でまとめた台風の経路（ベストトラック）。1951年以降に発生した台風について、6時間ごとの中心位置・中心気圧・最大風速・暴風域と強風域の半径、日本への上陸・通過の有無を収録する。
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: international_id
        data_type: VARCHAR
      - name: season
        data_type: INTEGER
      - name: serial_number
        data_type: INTEGER
      - name: name
        data_type: VARCHAR
      - name: analysis_time
        data_type: TIMESTAMP
      - name: analysis_time_utc
        data_type: TIMESTAMP
      - name: grade_code
        data_type: VARCHAR
      - name: grade
        data_type: VARCHAR
      - name: latitude
        data_type: DOUBLE
      - name: longitude
        data_type: DOUBLE
      - name: central_pressure_hpa
        data_type: INTEGER
      - name: max_wind_speed_kt
        data_type: INTEGER
      - name: max_wind_speed_ms
        data_type: DOUBLE
      - name: wind50_direction_code
        data_type: VARCHAR
      - name: wind50_direction
        data_type: VARCHAR
      - name: wind50_longest_radius_nm
        data_type: INTEGER
      - name: wind50_shortest_radius_nm
        data_type: INTEGER
      - name: wind30_direction_code
        data_type: VARCHAR
      - name: wind30_direction
        data_type: VARCHAR
      - name: wind30_longest_radius_nm
        data_type: INTEGER
      - name: wind30_shortest_radius_nm
        data_type: INTEGER
      - name: is_landfall
        data_type: BOOLEAN
