version: 2

models:
  - name: mart_jma_weekly_forecasts
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: office_code
        data_type: VARCHAR
      - name: report_datetime
        data_type: TIMESTAMP WITH TIME ZONE
      - name: area_code
        data_type: VARCHAR
      - name: area_name
        data_type: VARCHAR
      - name: forecast_date
        data_type: DATE
      - name: weather_code
        data_type: VARCHAR
      - name: pop_pct
        data_type: INTEGER
      - name: reliability
        data_type: VARCHAR
