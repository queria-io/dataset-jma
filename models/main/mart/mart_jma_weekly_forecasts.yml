version: 2

models:
  - name: mart_jma_weekly_forecasts
    description: >-
      気象庁の府県予報区ごとの週間天気予報（7日分）。週間予報の区域別の天気コード・
      降水確率・信頼度を日ごとに収録する。ビルド時点の最新発表（report_datetime）の1
      スナップショット。
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: office_code
        data_type: VARCHAR
      - name: report_datetime
        data_type: TIMESTAMP WITH TIME ZONE
      - name: area_code
        data_type: VARCHAR
      - name: area_name
        data_type: VARCHAR
      - name: forecast_date
        data_type: DATE
      - name: weather_code
        data_type: VARCHAR
      - name: pop_pct
        data_type: INTEGER
      - name: reliability
        data_type: VARCHAR
