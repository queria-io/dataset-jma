version: 2

models:
  - name: raw_jma_stations
    columns:
      - name: station_id
      - name: name
      - name: name_kana
      - name: name_en
      - name: lat
      - name: lon
      - name: elevation
      - name: station_type
      - name: is_office
      - name: elems

  - name: raw_jma_areas
    columns:
      - name: area_code
      - name: level
      - name: name
      - name: name_en
      - name: name_kana
      - name: office_name
      - name: parent_code

  - name: raw_jma_normals_daily
    columns:
      - name: station_id
      - name: month
      - name: day
      - name: temp_avg_c
      - name: temp_max_c
      - name: temp_min_c
      - name: sunshine_hours
      - name: precipitation_mm
      - name: snow_depth_cm

  - name: raw_jma_hypocenters
    columns:
      - name: record_type
      - name: origin_time
      - name: latitude
      - name: longitude
      - name: depth_km
      - name: magnitude
      - name: magnitude_type
      - name: magnitude2
      - name: magnitude2_type
      - name: subtype_code
      - name: max_intensity_code
      - name: region
      - name: station_count
      - name: hypocenter_flag

  - name: raw_jma_typhoon_tracks
    columns:
      - name: international_id
      - name: season
      - name: serial_number
      - name: name
      - name: analysis_time
      - name: analysis_time_utc
      - name: grade_code
      - name: latitude
      - name: longitude
      - name: central_pressure_hpa
      - name: max_wind_speed_kt
      - name: wind50_direction_code
      - name: wind50_longest_radius_nm
      - name: wind50_shortest_radius_nm
      - name: wind30_direction_code
      - name: wind30_longest_radius_nm
      - name: wind30_shortest_radius_nm
      - name: is_landfall

  - name: raw_jma_forecasts
    columns:
      - name: office_code
      - name: report_datetime
      - name: area_code
      - name: area_name
      - name: forecast_datetime
      - name: weather_code
      - name: weather
      - name: wind
      - name: wave

  - name: raw_jma_forecast_pops
    columns:
      - name: office_code
      - name: report_datetime
      - name: area_code
      - name: area_name
      - name: forecast_datetime
      - name: pop

  - name: raw_jma_forecast_temps
    columns:
      - name: office_code
      - name: report_datetime
      - name: area_code
      - name: area_name
      - name: forecast_datetime
      - name: temp

  - name: raw_jma_weekly_forecasts
    columns:
      - name: office_code
      - name: report_datetime
      - name: area_code
      - name: area_name
      - name: forecast_datetime
      - name: weather_code
      - name: pop
      - name: reliability

  - name: raw_jma_weekly_forecast_temps
    columns:
      - name: office_code
      - name: report_datetime
      - name: station_id
      - name: station_name
      - name: forecast_datetime
      - name: temp_min
      - name: temp_min_upper
      - name: temp_min_lower
      - name: temp_max
      - name: temp_max_upper
      - name: temp_max_lower
      - name: normal_temp_min
      - name: normal_temp_max
      - name: normal_precip_lower
      - name: normal_precip_upper

  - name: raw_jma_observation_stations
    columns:
      - name: block_no
      - name: prec_no
      - name: station_name
      - name: station_kana
      - name: lat
      - name: lon

  - name: raw_jma_daily_observations
    columns:
      - name: block_no
      - name: observed_date
      - name: precipitation_mm
      - name: temp_avg_c
      - name: temp_max_c
      - name: temp_min_c
      - name: sunshine_hours
      - name: snowfall_cm
      - name: snow_depth_cm

  - name: raw_jma_hourly_observations
    columns:
      - name: block_no
      - name: observed_date
      - name: hour
      - name: pressure_local_hpa
      - name: pressure_sea_hpa
      - name: precipitation_mm
      - name: temp_c
      - name: humidity_pct
      - name: wind_speed_ms
      - name: wind_direction
      - name: sunshine_hours
      - name: snow_depth_cm

  - name: raw_jma_sakura_phenology
    columns:
      - name: phenomenon
      - name: station_name
      - name: is_current_station
      - name: species
      - name: year
      - name: observed_date
      - name: normal_month
      - name: normal_day
