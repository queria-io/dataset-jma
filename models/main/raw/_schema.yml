version: 2

models:
  - name: raw_jma_stations
    description: 気象庁アメダス観測所一覧（amedastable.json）の生データ
    columns:
      - name: station_id
        description: 観測所ID（アメダス番号、5桁）
      - name: name
        description: 観測所名（漢字）
      - name: name_kana
        description: 観測所名（カナ）
      - name: name_en
        description: 観測所名（英語）
      - name: lat
        description: 緯度（十進度）
      - name: lon
        description: 経度（十進度）
      - name: elevation
        description: 標高（m）
      - name: station_type
        description: 観測所種別（A〜G）
      - name: is_office
        description: 気象官署フラグ（種別A/B）
      - name: elems
        description: 観測種目フラグ（気象庁仕様の8桁文字列）

  - name: raw_jma_areas
    description: 気象庁の地域コード（area.json）の生データ
    columns:
      - name: area_code
        description: 地域コード
      - name: level
        description: 階層（center/office/class10/class15/class20）
      - name: name
        description: 地域名
      - name: name_en
        description: 地域名（英語）
      - name: name_kana
        description: 地域名（カナ、class20のみ）
      - name: office_name
        description: 担当気象台名（center/officeのみ）
      - name: parent_code
        description: 親地域コード

  - name: raw_jma_normals_daily
    description: アメダス日別平年値（1991〜2020年）の生データ。観測所×月日の1行
    columns:
      - name: station_id
        description: 観測所番号（アメダス番号、5桁）
      - name: month
        description: 月（1〜12）
      - name: day
        description: 日（1〜31、2月は閏日29日まで）
      - name: temp_avg_c
        description: 日平均気温の平年値（℃）
      - name: temp_max_c
        description: 日最高気温の平年値（℃）
      - name: temp_min_c
        description: 日最低気温の平年値（℃）
      - name: sunshine_hours
        description: 日照時間の平年値（時間）
      - name: precipitation_mm
        description: 降水量の平年値（mm）
      - name: snow_depth_cm
        description: 積雪の深さの日最大の平年値（cm）

  - name: raw_jma_hypocenters
    description: 気象庁 地震月報（カタログ編）の震源データの生データ
    columns:
      - name: record_type
        description: レコード種別（J:気象庁 / U:USGS / I:その他国際機関）
      - name: origin_time
        description: 震源時（オリジンタイム、日本標準時）
      - name: latitude
        description: 震央の緯度（十進度）
      - name: longitude
        description: 震央の経度（十進度）
      - name: depth_km
        description: 震源の深さ（km）
      - name: magnitude
        description: マグニチュード1（気象庁マグニチュード等）
      - name: magnitude_type
        description: マグニチュード1の種別（J/D/d/V/v/W/B/S）
      - name: magnitude2
        description: マグニチュード2
      - name: magnitude2_type
        description: マグニチュード2の種別
      - name: subtype_code
        description: 震源補助情報（1:通常地震 2:他機関依存 3:人工地震 4:噴火に伴う地震動等 5:低周波イベント）
      - name: max_intensity_code
        description: 最大震度コード（1〜7、A:5弱、B:5強、C:6弱、D:6強 ほか）
      - name: region
        description: 震央地名（英字）
      - name: station_count
        description: 震源決定に使用した観測点数
      - name: hypocenter_flag
        description: 震源決定フラグ（K/S/k/s/A/a/N/F）

  - name: raw_jma_typhoon_tracks
    description: 気象庁 台風ベストトラック（事後解析による台風経路）の生データ
    columns:
      - name: international_id
        description: 国際番号（西暦下2桁 + 年内の通し番号、例 2604）
      - name: season
        description: 台風の発生年（国際番号の年）
      - name: serial_number
        description: 年内の通し番号（台風何号か）
      - name: name
        description: 国際名（アジア名。命名前の台風はNULL）
      - name: analysis_time
        description: 解析時刻（日本標準時、6時間間隔）
      - name: analysis_time_utc
        description: 解析時刻（協定世界時）
      - name: grade_code
        description: 階級コード（2:熱帯低気圧 3:台風TS 4:台風STS 5:台風TY 6:温帯低気圧 7:責任領域に入った直後 9:TS以上の熱帯低気圧）
      - name: latitude
        description: 中心の緯度（十進度）
      - name: longitude
        description: 中心の経度（十進度）。日付変更線を越えた場合は180を超える値になる
      - name: central_pressure_hpa
        description: 中心気圧（hPa）
      - name: max_wind_speed_kt
        description: 最大風速（ノット）。1977年より前と、熱帯低気圧・温帯低気圧の期間はNULL
      - name: wind50_direction_code
        description: 暴風域（50ノット以上）の長径方向コード（0:なし 1:北東 2:東 3:南東 4:南 5:南西 6:西 7:北西 8:北 9:同心円）
      - name: wind50_longest_radius_nm
        description: 暴風域の長径（海里）。1977年より前はNULL
      - name: wind50_shortest_radius_nm
        description: 暴風域の短径（海里）
      - name: wind30_direction_code
        description: 強風域（30ノット以上）の長径方向コード（コード体系は暴風域と同じ）
      - name: wind30_longest_radius_nm
        description: 強風域の長径（海里）。1977年より前はNULL
      - name: wind30_shortest_radius_nm
        description: 強風域の短径（海里）
      - name: is_landfall
        description: 解析時刻から1時間以内に日本の陸地へ上陸・通過したか。フラグが付くのは1991年以降の台風だけ

  - name: raw_jma_forecasts
    description: 府県予報区ごとの短期天気予報（forecast JSONをclass10区域×対象日時に展開したもの）の生データ
    columns:
      - name: office_code
        description: 府県予報区コード（area.jsonのoffices）
      - name: report_datetime
        description: 発表日時（ISO8601文字列、日本標準時）
      - name: area_code
        description: 一次細分区域コード（class10）
      - name: area_name
        description: 一次細分区域名
      - name: forecast_datetime
        description: 予報対象日時（ISO8601文字列、日本標準時）
      - name: weather_code
        description: 天気予報コード
      - name: weather
        description: 天気の予報文
      - name: wind
        description: 風の予報文
      - name: wave
        description: 波の予報文（内陸はNULL）

  - name: raw_jma_observation_stations
    description: 気象官署の観測所レジストリ（過去の気象データ検索の観測所選択ページ）の生データ
    columns:
      - name: block_no
        description: 観測所番号（気象官署、5桁のブロック番号）
      - name: prec_no
        description: 都府県・地方の区分コード
      - name: station_name
        description: 観測所名（漢字）
      - name: station_kana
        description: 観測所名（カナ）
      - name: lat
        description: 緯度（十進度）
      - name: lon
        description: 経度（十進度）

  - name: raw_jma_daily_observations
    description: 気象官署の日別観測値（過去の気象データ検索の日別値ページ daily_s1.php）の生データ
    columns:
      - name: block_no
        description: 観測所番号（気象官署、5桁のブロック番号）
      - name: observed_date
        description: 観測日
      - name: precipitation_mm
        description: 日降水量の合計（mm）
      - name: temp_avg_c
        description: 日平均気温（℃）
      - name: temp_max_c
        description: 日最高気温（℃）
      - name: temp_min_c
        description: 日最低気温（℃）
      - name: sunshine_hours
        description: 日照時間（時間）
      - name: snowfall_cm
        description: 降雪の合計（cm）
      - name: snow_depth_cm
        description: 最深積雪（cm）

  - name: raw_jma_hourly_observations
    description: 気象官署の時別観測値（過去の気象データ検索の時別値ページ hourly_s1.php）の生データ
    columns:
      - name: block_no
        description: 観測所番号（気象官署、5桁のブロック番号）
      - name: observed_date
        description: 観測日
      - name: hour
        description: 時（毎正時、日本標準時、1〜24。24は24時＝翌日0時）
      - name: pressure_local_hpa
        description: 現地気圧（hPa）
      - name: pressure_sea_hpa
        description: 海面気圧（hPa）
      - name: precipitation_mm
        description: 1時間降水量（mm）
      - name: temp_c
        description: 気温（℃）
      - name: humidity_pct
        description: 相対湿度（％）
      - name: wind_speed_ms
        description: 風速（m/s）
      - name: wind_direction
        description: 風向（16方位、無風時は静穏）
      - name: sunshine_hours
        description: 1時間あたりの日照時間（時間）
      - name: snow_depth_cm
        description: 積雪の深さ（cm）
