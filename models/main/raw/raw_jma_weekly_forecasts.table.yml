schema: main
name: raw_jma_weekly_forecasts
description: 府県予報区ごとの週間天気予報（forecast JSONの2要素目を週間予報の区域×日に展開したもの）の生データ
published: false
fields:
  - name: office_code
    description: 府県予報区コード（area.jsonのoffices）
  - name: report_datetime
    description: 発表日時（ISO8601文字列、日本標準時）
  - name: area_code
    description: 週間予報の区域コード
  - name: area_name
    description: 週間予報の区域名
  - name: forecast_datetime
    description: 予報対象日（ISO8601文字列、日本標準時の0時）
  - name: weather_code
    description: 天気予報コード
  - name: pop
    description: 日ごとの降水確率（%、予報期間の初日は空文字）
  - name: reliability
    description: 予報の信頼度（A/B/C、予報期間の初日と2日目は空文字）
